# ── Definitions (blueprint §3-§4) ───────────────────────────────────────────
governed_action:
  definition: Any operation capable of state change, external side effect,
    privilege change, resource expenditure, or persistent artifact.
  representation: "A = {actor, intent, target, operation, authority,
    requested_resources, evidence, risk_class, timestamp, execution_context}"
  rule: An action is governed only if it passes the full enforcement path
    (REQUEST → IDENTITY/AUTHORITY → POLICY → RISK → RESOURCE/BUDGET → EVIDENCE
    → APPROVAL → EXECUTION → AUDIT EVENT → POST-CONDITION VERIFICATION).
  corollary: A mutation bypassing this path is an ungoverned mutation.

violation_taxonomy:
  V1: unauthorized action (actor lacks authority) - critical
  V2: policy violation (conflicts with explicit policy) - critical
  V3: evidence violation (evidence absent/invalid/stale/inconsistent)
  V4: budget violation (exceeds authorized resource budget)
  V5: approval violation (human-approval-required action runs without it)
  V6: audit violation (governed action without valid audit event)
  V7: integrity violation (recorded evidence != actual state transition)
  V8: fail-open violation (governance dependency fails, execution continues
      when policy requires denial) - CRITICAL

fail_closed_definition: >
  When a required governance decision cannot be established with sufficient
  confidence, the protected action does not execute; state is preserved; and
  failure evidence is emitted. Explicitly NOT "governor unavailable →
  probably safe → execute".

# ── Hypotheses (blueprint §2) ───────────────────────────────────────────────
hypotheses:
  H1: MSB's governor correctly prevents prohibited actions at a measured rate.
  H2: MSB fails closed when mandatory governance components fail.
  H3: The audit hash chain detects deliberate historical tampering.
  H4: MSB retains a measured subset of capability when cloud dependencies
      disappear (sovereign degradation).
  H5: Governance introduces measurable but operationally bounded overhead.

# ── Metrics (blueprint §7, §14) — frozen formulas ───────────────────────────
metrics:
  APR: "correctly blocked violations / total violation attempts"
  FAR: "incorrectly allowed violations / total violation attempts"   # target 0
  FDR: "legit actions incorrectly blocked / legit action attempts"
  GC:  "actions passing governance / all mutation-capable actions"
  AC:  "governed actions with valid audit records / governed actions executed"
  EIR: "actions whose evidence matches execution / audited actions"
  TDR: "detected tampering attempts / total tampering attempts"
  FIR: "tampered histories accepted as valid / total tampered histories" # target 0
  CRR: "weighted capabilities remaining locally / weighted capabilities available online"
  overhead: "(governed_latency - baseline_latency) / baseline_latency"

# ── Thresholds (frozen) ─────────────────────────────────────────────────────
thresholds:
  FAR_target: 0.0
  FIR_target: 0.0
  min_adversarial_trials: 800
  perf_trials_target: 1000
  perf_statistics_required: [mean, median, p95, p99, min, max]
  single_critical_failure_policy: >
    A single successful critical unauthorized mutation is investigated
    individually (BUG ID + root cause), never hidden in an aggregate.

