services:
  # Open WebUI — ChatGPT-style front end for MSB v3. It talks to the API on
  # the HOST (launchd/standby on :8766) through the OpenAI-compatible /v1
  # adapter, so no MSB container is needed: host.docker.internal resolves on
  # Docker Desktop (macOS/Windows) automatically.
  #   UI: http://localhost:3001   ->   /v1 (host :8766)  ->  ChatHarness
  # Auth: adapter is fail-closed on OPENAI_API_KEY; set it in .env (also
  # exported to the repo env for the tests). See docs/open-webui-adapter-v1.md.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      # Host port is 3001 — Grafana owns :3000 on this box.
      - "3001:8080"
    environment:
      # Route ALL chat through MSB; disable Open WebUI's native Ollama pass-through.
      - ENABLE_OLLAMA_API=false
      - OPENAI_API_BASE_URL=http://host.docker.internal:8766/v1
      # Document RAG: embed uploaded files through MSB's /v1/embeddings
      # (nomic-embed-text, 768d) instead of the default local sentence-
      # transformers model. RAG_OPENAI_API_* fall back to the OPENAI_* values
      # above, and RAG_EMBEDDING_MODEL must match the adapter's provider.
      - RAG_EMBEDDING_ENGINE=openai
      - RAG_EMBEDDING_MODEL=nomic-embed-text
      # Empty key = Open WebUI runs but /v1 stays closed (adapter 503s)
      # until OPENAI_API_KEY is set in .env.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Signing key for Open WebUI sessions/encryption. Leave unset and Open
      # WebUI auto-generates + persists one in its volume (openssl rand -hex 32
      # if you want your own). Required for MCP/OAuth integrations to survive
      # restarts.
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
      # File uploads -> Tencent COS (S3-compatible). Default is "local"
      # (Open WebUI crashes on an EMPTY provider value, so never let this go
      # blank). To enable COS: fill TENCENT_COS_* in .env AND set
      # STORAGE_PROVIDER=s3 in .env — the S3_* vars below follow.
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - S3_ACCESS_KEY_ID=${TENCENT_COS_SECRET_ID:-}
      - S3_SECRET_ACCESS_KEY=${TENCENT_COS_SECRET_KEY:-}
      - S3_ENDPOINT_URL=${TENCENT_COS_ENDPOINT:-https://cos.ap-guangzhou.myqcloud.com}
      - S3_REGION_NAME=${TENCENT_COS_REGION:-ap-guangzhou}
      - S3_BUCKET_NAME=${TENCENT_COS_BUCKET:-}
      - S3_ADDRESS_STYLE=path
    volumes:
      - open_webui_data:/app/backend/data
    restart: unless-stopped

  brain:
    build:
      context: .
      dockerfile: docker/sovereign/Dockerfile.brain
    ports:
      - "8767:8767"
    environment:
      - SOVEREIGN_ENV=development
    depends_on:
      memory:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from msb_v3.core.event_bus import EventBus"]
      interval: 10s
      timeout: 5s
      retries: 3

  heart:
    build:
      context: .
      dockerfile: docker/sovereign/Dockerfile.heart
    ports:
      - "8768:8768"
    environment:
      - SOVEREIGN_ENV=development
    depends_on:
      memory:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from msb_v3.core.event_bus import EventBus"]
      interval: 10s
      timeout: 5s
      retries: 3

  memory:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - memory_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  memory_data:
  open_webui_data:
