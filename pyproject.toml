[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msb-v3"
version = "0.5.0"
description = "Sovereign local-first AI runtime — sovereign core"
requires-python = ">=3.11"

dependencies = [
  # No-op comment (2026-08-16): re-fire the dependency-graph submission to
  # confirm the .in-removal fix. Touches the manifest without changing any pin.
  "fastapi==0.141.1",
  "uvicorn[standard]==0.34.1",
  "pydantic==2.10.6",
  "httpx==0.28.1",
  "prometheus-client==0.21.1",
  "qdrant-client==1.18.0",
  "cryptography==50.0.0",
  "asn1crypto==1.5.1",  # RFC 3161 trusted timestamping (uac/timestamping.py): pure-Python ASN.1 for the TSA token — zero transitive deps
  "python-pkcs11==0.9.5",  # YubiKey PIV signing via libykcs11 PKCS#11 (uac/signing.py)
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",  # PYSEC-2026-1845: 8.3.5 vulnerable (pip-audit gate)
  "pytest-xdist==3.8.0",  # parallel test execution — cuts CI from 8min to ~3min
  "pytest-asyncio==1.4.0",  # 0.24.0 requires pytest<9 — clashes with the 9.0.3 CVE pin
  "ruff==0.9.4",
  "mypy==2.3.0",  # CI lint job runs `mypy src` — was only an ad-hoc factory-gate arg
  "pip-tools==7.6.1",  # `make deps` regenerates the *.lock files
  "PyYAML==6.0.3",  # workflow-structure guard tests (tests/test_harness_gate_wiring.py)
  "types-PyYAML==6.0.12.20260724",  # mypy stubs for the PyYAML import
  "hypothesis==6.148.9",  # property-based security tests (tests/security/test_property_based.py, P14)
  "requests==2.33.0",  # HTTP-level security tests (tests/security/test_{replay_protection,race_toctou,cold_state_verification}.py, P10-P13); 2.32.3 had PYSEC-2026-1872/2275
]
speech = [
  "webrtcvad==2.0.10",  # VAD in msb_v3/speech/vad.py — EXPERIMENTAL subsystem, not in the release contract; tests importorskip when absent
]

# Ruff gates MUST agree across every invocation: the CI lint job runs plain
# `ruff check src/ tests/` (default selection) while factory-gate pins
# `--select E9,F,I`. In 2026-08 the silent-except sweep landed 138 E402s
# (imports below a logger assignment) that E9/F/I cannot see — only the
# default selection caught them. Pin one selection here so `ruff check`
# (no flags) is identical everywhere: ruff's default E4/E7/E9/F + I, plus
# BLE001 — see the backlog table below for why it is on and what is left.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE001"]

# --- BLE001 (flake8-blind-except): on, with a written-down backlog --------
#
# 130 sites across `src/` already carried a `# noqa: BLE001` with a stated
# reason before this rule was enabled. Those annotations were INERT: BLE001
# was not in `select`, so nothing ever evaluated them, and a deliberate
# swallowing decision looked identical to an unconsidered one. Enabling the
# rule is what makes that reasoning load-bearing. (Audit finding, 2026-09-23.)
#
# The table below is the remainder: 60 files / 152 blind `except Exception:`
# sites that have no recorded reason yet, measured 2026-09-23. They are
# ignored per-file rather than by turning the rule off, so the backlog stays
# visible and countable:
#
#   * a file that stops appearing here has been triaged;
#   * a NEW blind except in any file NOT listed fails `make lint` immediately.
#
# Burn-down: triage a file, delete its row. Start where the counts are worst —
# api/research.py (14) and tools/executors.py (10). Each site wants one of:
#   - a narrowed type (`except (OSError, UnicodeDecodeError)`),
#   - a logged swallow carrying a reason,
#   - or `# noqa: BLE001 — <why a blanket catch is correct here>`.
#
# The 14 silent `except Exception: pass` sites (which discarded the failure
# entirely, logging nothing) were the actual defect and are fixed: 8 files —
# including the whole PLEI analysis path — were cleaned out of this list, and
# the sites that remain swallow nothing silently.
[tool.ruff.lint.per-file-ignores]
"src/msb_v3/agent/execution_loop.py" = ["BLE001"]
"src/msb_v3/agent/handle.py" = ["BLE001"]
"src/msb_v3/agent/intent.py" = ["BLE001"]
"src/msb_v3/agent/planner.py" = ["BLE001"]
"src/msb_v3/agent/safety.py" = ["BLE001"]
"src/msb_v3/api/agent.py" = ["BLE001"]
"src/msb_v3/api/app.py" = ["BLE001"]
"src/msb_v3/api/chat.py" = ["BLE001"]
"src/msb_v3/api/conversation.py" = ["BLE001"]
"src/msb_v3/api/dashboard.py" = ["BLE001"]
"src/msb_v3/api/flywheel.py" = ["BLE001"]
"src/msb_v3/api/governance.py" = ["BLE001"]
"src/msb_v3/api/health.py" = ["BLE001"]
"src/msb_v3/api/home.py" = ["BLE001"]
"src/msb_v3/api/mcp_bridge.py" = ["BLE001"]
