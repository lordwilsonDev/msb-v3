name: factory-gate

# Engineering-hygiene factory gate for msb-v3.
# Every push/PR to main re-runs the real pytest suite (with a coverage gate),
# mypy, ruff (E9/F/I — syntax + pyflakes + import-sort), the offline hygiene
# experiments, a live x-mcp-secret auth probe, and the conversation E2E probe
# (the ask->retrieve->guardrail->answer->log contract) against freshly booted
# servers. Any non-PASS leg fails the job, which blocks the push/merge.
#
# Coverage baseline: 72% measured (2026-08-12). The gate prevents
# regression below 70% — raise it as coverage grows.
#
# Requires one repo secret:
#   MSB_MCP_SECRET  ->  the MCP_BRIDGE_SECRET the server must accept.
#                       The probe is fail-closed: missing secret = failed job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    name: factory-gate (tests + cov + types + lint + hygiene + auth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install (editable + dev extras + gate tools)
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov mypy ruff pip-audit

      # Note: bare `pytest` follows pyproject testpaths = tests +
      # the chaos suite (358 tests). The factory gate artifact
      # (factory_gate.json) runs `pytest tests/` (232) — CI is deliberately
      # the wider net. factory_gate.json is a point-in-time record, not a CI
      # mirror.
      #
      # Live integration tests use the run-scoped endpoint allocated by the
      # CI runtime helper below. They never borrow a developer server.
      - name: Regression suite + coverage gate
        env:
          MCP_BRIDGE_SECRET: ${{ secrets.MSB_MCP_SECRET }}
          # Skills come from the committed fixture (not ~/.hermes on the
          # runner); research state is repo-relative via MSB_RESEARCH_ROOT
          # default. test_ready skips without ollama/db; the harness tests
          # (claims_review, ralph STATUS) are seeded from the committed
          # research-runtime fixtures below so they RUN (runtime/ is
          # gitignored machine state on a fresh checkout).
          MSB_SKILLS_DIR: ${{ github.workspace }}/tests/fixtures/skills
          # Hosted runners have no home-dir source license — owner checkout,
          # so the entry point skips the license gate (msb_v3/__main__.py).
          MSB_CI: 1
        run: |
          set -euo pipefail
          source scripts/ci-runtime.sh
          ci_runtime_init
          bash scripts/seed-research-runtime.sh
          ci_runtime_start_server
          pytest --cov=msb_v3 --cov-report=term --cov-fail-under=70 -q

      # Full scope: types ALL three packages, not just src/msb_v3 — the
      # msb_v3 test surface blind spot cost 5 real errors
      # (now fixed).
      - name: Typed enforcement (mypy)
        # Run regardless of the regression suite's result — no leg may be
        # masked by an earlier failure.
        if: always()
        # No --ignore-missing-imports: the blanket suppress masked the P4
        # extraction's red state (sys.modules shim aliases are runtime-only,
        # invisible to static mypy). Bare mypy is the discipline; targeted
        # overrides live in pyproject.toml ([tool.mypy.overrides]).
        run: mypy src

      # Uses the pinned selection in pyproject.toml ([tool.ruff.lint] =
      # E4/E7/E9/F/I) so this gate can never diverge from the CI lint job's
      # default-selection run again (138 E402s slipped through E9/F/I-only
      # in 2026-08).
      - name: Lint gate (ruff, pyproject selection)
        if: always()
        run: ruff check .

      # MoIE detection policy drift gate — same contract as the ci.yml
      # lint job: the committed policy must match the pinned baseline
      # (MSB-GATE-EVAL-001), so a detection-policy edit can never land
      # without its pin update in the same change.
      - name: Policy drift gate
        if: always()
        env:
          MSB_REPO: ${{ github.workspace }}
          MSB_PYTHON: python
        run: bash scripts/ci-policy-gate.sh

      - name: Hygiene suite (offline experiments)
        if: always()
        env:
          MSB_REPO: ${{ github.workspace }}
          MSB_PYTHON: python
          MCP_BRIDGE_SECRET: ${{ secrets.MSB_MCP_SECRET }}
          MSB_SKILLS_DIR: ${{ github.workspace }}/tests/fixtures/skills
          MSB_RESEARCH_ROOT: ${{ runner.temp }}/msb-research
          # The /business write experiments (h02/h04/h06/h08/h10) hit the
          # operator-gated /business/register|purge. A fresh checkout has no
          # .env and there is no MSB_OPERATOR_TOKEN repo secret, so seed a
          # throwaway token: the booted server (settings.operator_token) and
          # the runners both read this env and match. It gates a throwaway
          # CI test server, not a real control surface.
          MSB_OPERATOR_TOKEN: ci-operator-token
          MSB_CI: 1
        run: |
          set -euo pipefail
          # h01-h10 (except h07) probe the isolated run-scoped API. h02
          # deliberately exercises its own supervisor contract.
          source scripts/ci-runtime.sh
          ci_runtime_init
          ci_runtime_start_server
          python scripts/hygiene/hygiene_runner.py --all

      - name: Live auth probe (x-mcp-secret contract)
        if: always()
        env:
          MCP_BRIDGE_SECRET: ${{ secrets.MSB_MCP_SECRET }}
          MSB_SKILLS_DIR: ${{ github.workspace }}/tests/fixtures/skills
          MSB_CI: 1
        run: |
          set -euo pipefail
          : "${MCP_BRIDGE_SECRET:?set repo secret MSB_MCP_SECRET — probe is fail-closed}"
          source scripts/ci-runtime.sh
          ci_runtime_init
          ci_runtime_start_server
          # `|| echo 000`: if the server vanishes mid-probe, fail the assertion
          # with a clear value instead of dying with curl's transport exit code.
          missing=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${MSB_PORT}/mcp/tools" || echo 000)
          wrong=$(curl -s -o /dev/null -w '%{http_code}' -H "x-mcp-secret: wrong-secret" "http://127.0.0.1:${MSB_PORT}/mcp/tools" || echo 000)
          correct=$(curl -s -o /dev/null -w '%{http_code}' -H "x-mcp-secret: $MCP_BRIDGE_SECRET" "http://127.0.0.1:${MSB_PORT}/mcp/tools" || echo 000)
          echo "auth probe: missing=$missing wrong=$wrong correct=$correct (expect 401 401 200)"
          [ "$missing" = "401" ] && [ "$wrong" = "401" ] && [ "$correct" = "200" ]

      # Close-out gate (FR-4.3): the definition of done runs in CI. The
      # regression step above already ran the full pytest+coverage leg, so
      # this job runs the gate as the aggregator over the remaining legs
      # (lint battery + pip-audit + container /health smoke) — every leg of
      # the close-out gate is exercised by CI on every push, and this job
      # pins them together so the gate cannot silently regress.
      - name: Close-out gate (lint + pip-audit + docker smoke)
        if: always()
        env:
          MSB_CLOSE_OUT_SKIP: pytest
          # The gate script defaults to the owner's macOS conda python; on a
          # hosted runner MSB_PYTHON must point at the venv python.
          MSB_PYTHON: python
        run: bash scripts/close-out-gate.sh

      - name: Conversation E2E probe (stub, zero-spend)
        if: always()
        # The conversation contract is the E2E probe: ask -> retrieve -> input
        # guardrail -> compose -> output guardrail -> answer -> log, every hop
        # emitting evidence into a scratch ledger. Stub model + deterministic
        # producer + recorded replay = zero spend, zero keys, runs on every
        # push. A failing assertion fails the job (docs/conversation-e2e-harness-v1.md).
        env:
          MCP_BRIDGE_SECRET: ${{ secrets.MSB_MCP_SECRET }}
          MSB_CONVERSATION_MODEL: stub
          MSB_CONVERSATION_LEDGER_DIR: ${{ runner.temp }}/msb-conversation-ledger
          MSB_SKILLS_DIR: ${{ github.workspace }}/tests/fixtures/skills
          MSB_CI: 1
        run: |
          set -euo pipefail
          : "${MCP_BRIDGE_SECRET:?set repo secret MSB_MCP_SECRET — probe is fail-closed}"
          # Run the probe against the same run-scoped server contract used by
          # the other live legs.
          source scripts/ci-runtime.sh
          ci_runtime_init
          ci_runtime_start_server
          MSB_BASE="http://127.0.0.1:${MSB_PORT}" MSB_PORT="$MSB_PORT" python scripts/probe_conversation_e2e.py --mode stub --replay
