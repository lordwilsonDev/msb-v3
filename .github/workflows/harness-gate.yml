name: harness-gate

# Browser + video-harness evidence gate: runs the full webcheck-all suite
# with the `endpoints` and `harness` stages in one pass and uploads the
# harness-evidence-report/v1 artifact so CI consumers (e.g.
# scripts/ci-harness-gate.sh) can gate downstream jobs on it.
#
# WHY SELF-HOSTED: these two stages exercise machine-local state that a
# hosted runner cannot have:
#   - ~/bin/webcheck.py (the Playwright driver, channel="chrome") is not in
#     the repo
#   - ~/video-harness/evidence (the evidence dir the harness stage gates) is
#     not a git repo
#   - the live server (:8766), Qdrant (:6333), and system Chrome
# Pre-push local dry-run of these exact steps: make harness-gate-dryrun
# (same probes + gate, minus the upload).
#
# Register a runner on the sovereign box and set its labels to match
# `runs-on` below (or change the labels). This gate tests the pushed commit's
# *checks* against the machine's live stack (server/Qdrant/Chrome/evidence);
# the hosted ci.yml / factory-gate.yml workflows test the commit's *code*.
#
# Secrets: the auth-gated /mcp/status check resolves x-mcp-secret env ->
# .env (absent in a fresh checkout) -> shipped default, so a server running
# the shipped default needs no secrets. If the live server runs a custom
# secret, set the MSB_MCP_SECRET repo secret (same one factory-gate.yml
# documents) -- it is passed through on the webcheck-all step.
#
# RUNNER USER ACCOUNT: $HOME is load-bearing -- ~/bin/webcheck.py,
# ~/video-harness/evidence, miniforge python, and system Chrome all live in
# the dev user's home. Register the runner under the SAME account
# (lordwilson); a runner under any other account fails with not-found errors.
#
# EVIDENCE FRESHNESS: the job self-heals stale evidence. A pre-flight step
# runs scripts/freshen-harness-evidence.sh (the same idempotent freshener
# the daily 06:30 LaunchAgent com.blackswanlabz.harness-evidence uses): if
# any experiment's evidence is older than FRESH_THRESHOLD_H (12h) it
# re-runs make run/run-p1/run-p2 in ~/video-harness (deterministic,
# seconds) before the evidence gate below judges it.
#
# Services are shared infrastructure: `make qdrant-start` / `make
# server-start` are best-effort (both exit 1 when already healthy) and the
# workflow never stops them -- same policy as the local routine. MSB_REPO is
# set to the workspace so scripts write artifacts/ inside the checkout, not
# the live ~/msb-v3.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: harness-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: endpoints + harness evidence
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Qdrant environment contract preflight
        run: |
          set -euo pipefail
          # The self-hosted runner PATH has no bare `python`; resolve the same
          # interpreter the Makefile uses.
          PY="${MSB_PYTHON:-/opt/homebrew/Caskroom/miniforge/base/bin/python}"
          MSB_QDRANT_ENABLED=1 "$PY" -c 'from msb_v3.infrastructure.qdrant_contract import preflight; r = preflight(); print(r); raise SystemExit(0 if r.ready else 1)'
        env:
          MSB_REPO: ${{ github.workspace }}
          PYTHONPATH: ${{ github.workspace }}/src

      - name: Ensure msb-v3 server is up (declared self-hosted endpoint)
        run: |
          set -euo pipefail
          : "${MSB_BASE_URL:?MSB_BASE_URL must be declared by the self-hosted runner}"
          for _ in $(seq 1 30); do
            curl -fsS -m 2 "$MSB_BASE_URL/health" >/dev/null && exit 0
            sleep 1
          done
          echo "msb-v3 not healthy at $MSB_BASE_URL after 30s" >&2
          exit 1
        env:
          MSB_REPO: ${{ github.workspace }}
          MSB_BASE_URL: ${{ vars.MSB_BASE_URL }}

      # Self-heal before the evidence gate: if the video-harness evidence is
      # stale (e.g. the daily 06:30 freshen LaunchAgent was missed because
      # the box was off), re-run the three baseline experiments so the
      # harness stage below doesn't block on age. The freshener skips when
      # every experiment's newest evidence is PASS and under 12h, so this is
      # cheap on every run. It targets the runner's REAL ~/video-harness
      # (HARNESS_DIR defaults to $HOME/video-harness — never the workspace)
      # but uses THIS checkout's gate script via MSB_REPO. Best-effort on
      # purpose: if it fails, the harness stage below still runs and ships
      # the authoritative report.
      - name: Pre-flight freshen (harness evidence self-heal)
        run: |
          bash scripts/freshen-harness-evidence.sh \
            || { echo "[pre-flight] freshener failed — evidence may be stale; the harness gate below is authoritative"; }
        env:
          MSB_REPO: ${{ github.workspace }}

      - name: Run webcheck-all (endpoints + harness evidence gate)
        run: make webcheck-all STAGES=endpoints,harness
        env:
          MSB_REPO: ${{ github.workspace }}
          MCP_BRIDGE_SECRET: ${{ secrets.MSB_MCP_SECRET }}

      # Env drift guard, strict: a fresh checkout has no .env (the guard
      # would skip), so generate one from the locked .env.example and prove
      # strict mode. What this catches despite the env being template-
      # generated: (a) template/parser regressions — a malformed or
      # non-parsing .env.example fails the contract-var check; (b) the real
      # invariant — --template-secrets-block fails if ANY secret placeholder
      # carries a value in the committed template (a key in .env.example
      # would ship to every checkout); and (c) the portability step below
      # then runs its warn-only drift guard against a real .env instead of
      # skipping.
      - name: Env drift guard (template-generated .env, strict)
        # Independent of the live Qdrant/server stages — run even if they
        # fail so this leg's result is never masked.
        if: always()
        run: |
          cp .env.example .env
          bash scripts/check-env-drift.sh --fail --template-secrets-block
        env:
          MSB_REPO: ${{ github.workspace }}

      # Portability gate: stages a temp copy of the checkout and runs the
      # FULL pytest suite there (scripts/test.sh, no server boot — pure
      # pytest), failing if any /Users/... machine literal remains or if
      # any test needs the original machine path. Self-contained; the live
      # server from the step above is only relied on by the live endpoint
      # tests, exactly as in the local routine. Also re-runs the drift guard
      # (warn-only) against the .env generated above.
      - name: Portability gate (full suite from a foreign checkout path)
        # Pure pytest from a foreign checkout (live tests are opt-in) —
        # independent of the live Qdrant/server stages, so never mask it.
        if: always()
        run: make portability
        env:
          MSB_REPO: ${{ github.workspace }}

      # Upload even on failure so a red gate still ships the report, the
      # stage logs (producer FAIL lines + consumer BLOCK detail), and the
      # endpoint screenshots for inspection.
      - name: Upload report + logs + screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: harness-gate-artifacts
          path: |
            artifacts/harness-evidence-report.json
            artifacts/webcheck-all-*.log
            artifacts/webcheck-*
          if-no-files-found: warn
          retention-days: 14
