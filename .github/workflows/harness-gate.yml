name: harness-gate

# Browser endpoint gate: runs the webcheck-all `endpoints` stage against the
# live self-hosted stack.
#
# DROPPED 2026-09-11: the `harness` stage (video-harness evidence:
# p0_basic/p1_ffmpeg/p2_inference). `~/video-harness` does not exist on this
# runner's machine — confirmed absent, not just stale — and no doc anywhere
# describes what those three experiments were supposed to verify, so there
# is no way to rebuild them without fabricating pass criteria. This CI leg
# had been failing on every push since the repo move (2026-09-02) as a
# result. The job keeps its original name ("endpoints + harness evidence")
# so it stays compatible with anything watching that check name, but only
# runs `endpoints` now. The freshener LaunchAgent
# (com.blackswanlabz.harness-evidence) is likewise disabled — see
# docs/ops-runbook.md. To re-enable the harness stage: rebuild
# ~/video-harness with real p0_basic/p1_ffmpeg/p2_inference experiments,
# then flip STAGES back to `endpoints,harness` below and restore the
# pre-flight freshen step (see git history, removed the same commit as this
# comment) and the LaunchAgent.
#
# WHY SELF-HOSTED: the endpoints stage exercises machine-local state a
# hosted runner cannot have: ~/bin/webcheck.py (the Playwright driver,
# channel="chrome") is not in the repo, plus the live server (:8766), Qdrant
# (:6333), and system Chrome.
# Pre-push local dry-run of these exact steps: make harness-gate-dryrun.
#
# Register a runner on the sovereign box and set its labels to match
# `runs-on` below (or change the labels). This gate tests the pushed commit's
# *checks* against the machine's live stack (server/Qdrant/Chrome); the
# hosted ci.yml / factory-gate.yml workflows test the commit's *code*.
#
# Secrets: the auth-gated /mcp/status check resolves x-mcp-secret env ->
# .env (absent in a fresh checkout) -> shipped default, so a server running
# the shipped default needs no secrets. If the live server runs a custom
# secret, set the MSB_MCP_SECRET repo secret (same one factory-gate.yml
# documents) -- it is passed through on the webcheck-all step.
#
# RUNNER USER ACCOUNT: $HOME is load-bearing -- ~/bin/webcheck.py, miniforge
# python, and system Chrome all live in the dev user's home. Register the
# runner under the SAME account (lordwilson); a runner under any other
# account fails with not-found errors.
#
# Services are shared infrastructure: `make qdrant-start` / `make
# server-start` are best-effort (both exit 1 when already healthy) and the
# workflow never stops them -- same policy as the local routine. MSB_REPO is
# set to the workspace so scripts write artifacts/ inside the checkout, not
# the live ~/msb-v3.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: harness-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: endpoints + harness evidence
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Qdrant environment contract preflight
        run: |
          set -euo pipefail
          # The self-hosted runner PATH has no bare `python`; resolve the same
          # interpreter the Makefile uses.
          PY="${MSB_PYTHON:-/opt/homebrew/Caskroom/miniforge/base/bin/python}"
          MSB_QDRANT_ENABLED=1 "$PY" -c 'from msb_v3.infrastructure.qdrant_contract import preflight; r = preflight(); print(r); raise SystemExit(0 if r.ready else 1)'
        env:
          MSB_REPO: ${{ github.workspace }}
          PYTHONPATH: ${{ github.workspace }}/src

      - name: Ensure msb-v3 server is up (declared self-hosted endpoint)
        run: |
          set -euo pipefail
          : "${MSB_BASE_URL:?MSB_BASE_URL must be declared by the self-hosted runner}"
          for _ in $(seq 1 30); do
            curl -fsS -m 2 "$MSB_BASE_URL/health" >/dev/null && exit 0
            sleep 1
          done
          echo "msb-v3 not healthy at $MSB_BASE_URL after 30s" >&2
          exit 1
        env:
          MSB_REPO: ${{ github.workspace }}
          MSB_BASE_URL: ${{ vars.MSB_BASE_URL }}

      - name: Run webcheck-all (endpoints)
        # STAGES was `endpoints,harness` — harness dropped 2026-09-11, see
        # header comment. The pre-flight harness-evidence freshener step
        # that used to run here was removed with it (nothing left to
        # freshen).
        run: make webcheck-all STAGES=endpoints
        env:
          MSB_REPO: ${{ github.workspace }}
          MCP_BRIDGE_SECRET: ${{ secrets.MSB_MCP_SECRET }}

      # Env drift guard, strict: a fresh checkout has no .env (the guard
      # would skip), so generate one from the locked .env.example and prove
      # strict mode. What this catches despite the env being template-
      # generated: (a) template/parser regressions — a malformed or
      # non-parsing .env.example fails the contract-var check; (b) the real
      # invariant — --template-secrets-block fails if ANY secret placeholder
      # carries a value in the committed template (a key in .env.example
      # would ship to every checkout); and (c) the portability step below
      # then runs its warn-only drift guard against a real .env instead of
      # skipping.
      - name: Env drift guard (template-generated .env, strict)
        # Independent of the live Qdrant/server stages — run even if they
        # fail so this leg's result is never masked.
        if: always()
        run: |
          cp .env.example .env
          bash scripts/check-env-drift.sh --fail --template-secrets-block
        env:
          MSB_REPO: ${{ github.workspace }}

      # Portability gate: stages a temp copy of the checkout and runs the
      # FULL pytest suite there (scripts/test.sh, no server boot — pure
      # pytest), failing if any /Users/... machine literal remains or if
      # any test needs the original machine path. Self-contained; the live
      # server from the step above is only relied on by the live endpoint
      # tests, exactly as in the local routine. Also re-runs the drift guard
      # (warn-only) against the .env generated above.
      - name: Portability gate (full suite from a foreign checkout path)
        # Pure pytest from a foreign checkout (live tests are opt-in) —
        # independent of the live Qdrant/server stages, so never mask it.
        #
        # Deliberately NOT passing MCP_BRIDGE_SECRET here (reverted
        # 2026-09-11): injecting it caused real 401s, not passes — this
        # runner is self-hosted on the same Mac as the developer's own
        # persistent msb-v3 instance, so "the real running :8766 server"
        # these tests hit is not reliably the one secrets.MSB_MCP_SECRET
        # was meant for. The tests skip cleanly when the secret is
        # unavailable (tests/security/*.py, fixed the same day) — same
        # honest behavior as a genuine foreign checkout with no .env.
        if: always()
        run: make portability
        env:
          MSB_REPO: ${{ github.workspace }}

      # Upload even on failure so a red gate still ships the stage logs
      # (producer FAIL lines + consumer BLOCK detail) and the endpoint
      # screenshots for inspection. No harness-evidence-report.json anymore
      # (harness stage dropped 2026-09-11).
      - name: Upload report + logs + screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: harness-gate-artifacts
          path: |
            artifacts/webcheck-all-*.log
            artifacts/webcheck-*
          if-no-files-found: warn
          retention-days: 14
