name: release-verify

# Auto-verify every semver release tag from a VIRGIN CLONE of the tag — as
# others would fetch it: confirm the checkout is virgin (no tracked .env /
# runtime/), seed the research-runtime fixtures, boot a run-scoped msb-v3 from
# the clone, and run the `-m "not live"` suite against it — failing on any test
# failure or seeded-artifact skip. This is the v0.2.3 manual flow, automated
# (scripts/verify-release.sh). Also dispatchable manually on any tag (input;
# blank = v<pyproject version>).
#
# WHY SELF-HOSTED: macOS + the sovereign runtime (Ollama/Qdrant) only exist on
# the sovereign box (same rationale as harness-gate). The gate provisions its
# OWN msb-v3 on a random port (scripts/ci-runtime.sh) and no longer borrows a
# hand-managed :8766. The script clones the tag from the remote using the
# token-authenticated URL so even a private repo is fetchable inside CI.
#
# Pre-push local check: make verify-release (uses origin + local env).

on:
  push:
    # Semver releases AND release candidates — a fresh RC cut must be
    # auto-verified from a virgin clone just like a final release (rc2 was
    # verified only via workflow_dispatch on 2026-08-17 because the rc
    # pattern was missing).
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-rc*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to verify (blank = v<pyproject version>)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: virgin-clone verification
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # PRODUCTION-CLOSURE-001 P1 (Option A): the gate owns its runtime.
      # verify-release.sh boots a run-scoped msb-v3 from the clone on a random
      # port via scripts/ci-runtime.sh and tears it down on exit — it no longer
      # borrows a hand-managed :8766 / vars.MSB_BASE_URL. The suite runs
      # `-m "not live"` (real model generation is measured elsewhere, not gated).
      - name: Verify release from a virgin clone
        run: bash scripts/verify-release.sh
        env:
          # On a tag push the ref IS the tag; on dispatch use the input (or
          # the script's v<pyproject> default when blank).
          VERIFY_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          # The script clones the tag from the remote — authenticate with the
          # workflow token so a private repo is fetchable inside CI.
          VERIFY_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
