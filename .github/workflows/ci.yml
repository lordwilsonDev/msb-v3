name: msb-v3 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.any_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed files
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            src:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'requirements*.txt'

  # dorny/paths-filter@v3 emits BOOLEAN outputs (its v3.0.0 breaking change),
  # so `outputs.changed == 'true'` evaluates `true == 'true'` = false and every
  # gated job skipped on every push. Truthy check is correct for v3 booleans.
  test:
    needs: preflight
    if: needs.preflight.outputs.changed || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        env:
          MCP_BRIDGE_SECRET: ${{ secrets.MSB_MCP_SECRET }}
          MSB_SKILLS_DIR: ${{ github.workspace }}/tests/fixtures/skills
        run: |
          set -euo pipefail
          # The triumvirate/harness/skill-router suites are LIVE integration
          # tests hitting a real server on 127.0.0.1:8766 — boot it exactly
          # like the factory gate does, or they fail on every run.
          lsof -t -iTCP:8766 -sTCP:LISTEN 2>/dev/null | xargs -r kill 2>/dev/null || true
          python -m msb_v3 > /tmp/msb-ci-test-server.log 2>&1 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true; lsof -t -iTCP:8766 -sTCP:LISTEN 2>/dev/null | xargs -r kill 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8766/health && break
            sleep 1
          done
          if ! curl -sf -o /dev/null http://127.0.0.1:8766/health; then
            echo "server failed to boot — log follows"
            cat /tmp/msb-ci-test-server.log
            exit 1
          fi
          PYTHONPATH=src pytest tests/ -v --cov=msb_v3 --cov-report=xml --cov-report=json

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml,./coverage.json
          flags: ${{ matrix.os }}-py${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            coverage.xml
            coverage.json
            .coverage
          retention-days: 7

  lint:
    needs: preflight
    if: needs.preflight.outputs.changed || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check src/ tests/

      - name: Run mypy
        run: mypy src/msb_v3 --ignore-missing-imports
        continue-on-error: true

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            .ruff_cache/
            .mypy_cache/
          retention-days: 3

  security:
    needs: preflight
    if: needs.preflight.outputs.changed || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pip-audit
        run: pip-audit --strict
        continue-on-error: true

      - name: Check for secrets
        run: |
          git secrets --install || true
          git secrets --scan || true
        continue-on-error: true

      - name: Generate SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py . --output sbom.json --format json

      - name: Check license compliance
        run: |
          pip install pip-licenses
          pip-licenses --format=json --output-file=licenses.json
          grep -i "GPL\|AGPL" licenses.json && echo "::warning::GPL/AGPL license found" || true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            .pip-audit/
            .git/secrets/
            sbom.json
            licenses.json
          retention-days: 7

  docker:
    needs: preflight
    if: needs.preflight.outputs.changed || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: msb-v3:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container smoke test
        run: |
          docker run -d -p 8766:8766 --name msb-v3-test msb-v3:ci-${{ github.sha }}
          sleep 5
          # /status does not exist — /health is the app's liveness route.
          curl -f http://127.0.0.1:8766/health || (docker logs msb-v3-test && exit 1)
          docker rm -f msb-v3-test

  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify evidence claims
        run: python scripts/verify_claims.py docs/

      - name: Upload claim report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-report
          path: artifacts/smi018/claim_report.json
          retention-days: 7

  notify:
    needs: [test, lint, security, docker, claims]
    if: always() && (needs.test.result == 'failure' || needs.lint.result == 'failure' || needs.security.result == 'failure' || needs.docker.result == 'failure' || needs.claims.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Notify failure
        run: |
          echo "::warning::CI pipeline failed. Check artifacts for details."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Only MSB_MCP_SECRET is configured today. The secrets context is NOT valid
  # in job-level `if`, so a tiny probe job checks the four DEPLOY_* secrets in
  # a step (where secrets ARE valid) and gates deploy on the result — until
  # they exist, deploy skips cleanly instead of firing an SSH deployment with
  # empty credentials on every push.
  deploy-ready:
    needs: [test, lint, security, docker, claims]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check deploy secrets configured
        id: check
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_PATH" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: deploy-ready
    if: needs.deploy-ready.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Pre-deploy backup
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}' && \
             cp -r \"\$DEPLOY_PATH\" \"\${DEPLOY_PATH}.bak.\$(date +%Y%m%d-%H%M%S)\"" || true

      - name: Deploy
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd '${{ secrets.DEPLOY_PATH }}' && \
             git pull origin main && \
             PYTHONPATH=src python -m pip install -e '.[dev]' --quiet && \
             PYTHONPATH=src /opt/homebrew/Caskroom/miniforge/base/bin/python -m uvicorn msb_v3.api.app:create_app --host 127.0.0.1 --port 8766 --daemon"

      - name: Health check
        run: |
          for _i in $(seq 1 12); do
            if curl -sf http://${{ secrets.DEPLOY_HOST }}:8766/status; then
              echo "Deploy healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Deploy failed health check"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd '${{ secrets.DEPLOY_PATH }}' && \
             git reset --hard HEAD~1 && \
             PYTHONPATH=src /opt/homebrew/Caskroom/miniforge/base/bin/python -m uvicorn msb_v3.api.app:create_app --host 127.0.0.1 --port 8766 --daemon"
