name: msb-v3 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Always run: a red test suite must never be hidden behind a
    # paths-filter (a commit touching only scripts/experiments would
    # otherwise show green while the suite never ran).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov

      - name: Run tests with coverage
        env:
          MCP_BRIDGE_SECRET: ${{ secrets.MSB_MCP_SECRET }}
          MSB_SKILLS_DIR: ${{ github.workspace }}/tests/fixtures/skills
          # Hosted runners have no home-dir source license; this is the
          # owner's checkout (not an anonymous pull), so the entry point
          # skips the license gate (see msb_v3/__main__.py).
          MSB_CI: 1
        run: |
          set -euo pipefail
          # The triumvirate/harness/skill-router suites are LIVE integration
          # tests hitting a real server on 127.0.0.1:8766 — boot it exactly
          # like the factory gate does, or they fail on every run.
          # Seed the research-runtime fixtures FIRST so the booted server
          # serves the harness artifacts (claims/review ledger, ralph
          # STATUS.json) instead of 404 — runtime/ is gitignored machine
          # state on a fresh checkout.
          bash scripts/seed-research-runtime.sh
          lsof -t -iTCP:8766 -sTCP:LISTEN 2>/dev/null | xargs -r kill 2>/dev/null || true
          python -m msb_v3 > /tmp/msb-ci-test-server.log 2>&1 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true; lsof -t -iTCP:8766 -sTCP:LISTEN 2>/dev/null | xargs -r kill 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8766/health && break
            sleep 1
          done
          if ! curl -sf -o /dev/null http://127.0.0.1:8766/health; then
            echo "server failed to boot — log follows"
            cat /tmp/msb-ci-test-server.log
            exit 1
          fi
          PYTHONPATH=src pytest tests/ -v --cov=msb_v3 --cov-report=xml --cov-report=json --cov-fail-under=70

      - name: Upload coverage
        # codecov-action@v6 has NO tokenless upload for main-repo pushes
        # (tokenless was dropped in v4) — the CODECOV_TOKEN repo secret is
        # required. Set it with: gh secret set CODECOV_TOKEN -R <owner>/<repo>
        # fail_ci_if_error is ON so a revoked/expired token turns the test
        # job red instead of silently dropping coverage (the pre-token state).
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml,./coverage.json
          flags: ${{ matrix.os }}-py${{ matrix.python-version }}
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            coverage.xml
            coverage.json
            .coverage
          retention-days: 7

  lint:
    # Always run: ruff + mypy are cheap, and a red lint job must never be
    # hidden behind the src-changed paths-filter (a docs-only commit that
    # left a type error would otherwise show a green CI).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check src/ tests/

      # Full scope: types ALL three packages (msb_v3,
      # personal_intelligence), not just src/msb_v3. Blocking — the old
      # continue-on-error made this step a no-op that never gated.
      # No --ignore-missing-imports: the blanket suppress masked the P4
      # extraction's red state (shim aliases are runtime-only, invisible to
      # mypy) — bare mypy is the discipline; targeted overrides live in
      # pyproject.toml ([tool.mypy.overrides], e.g. asn1crypto).
      - name: Run mypy
        run: mypy src

      # Locks must stay in step with pyproject.toml (single source of truth).
      - name: Check requirement locks
        run: python scripts/gen-requirements.py --check

      # M8: the release declaration's capability claims must link to evidence
      # that exists and matches live test counts — the declaration can never
      # drift from the tree (or the claims are withdrawn).
      - name: Audit release claims
        run: python scripts/verify-claims.py

      # MoIE detection policy drift gate: config/risk_templates.json must
      # keep matching the pinned baseline (MSB-GATE-EVAL-001). A policy
      # edit that changes what the gate blocks (e.g. the Phase-2 keyword
      # win) fails here until the pins in test_gate_contract.py and
      # test_phase2_calibration.py are updated IN THE SAME change — no
      # silent detection drift. Fast, deterministic, no server needed.
      - name: Run policy drift gate
        run: bash scripts/ci-policy-gate.sh

      # Closer drift guard: closure-plan.md task statuses must match git log.
      # Prevents the "lying dashboard" problem where claimed completions
      # drift from actual commit evidence.
      - name: Closure drift guard
        run: python scripts/closure-drift-check.py

      # NOTE: there is deliberately no artifact upload here. The old
      # "Upload lint reports" step uploaded .ruff_cache/.mypy_cache under the
      # name lint-reports, but nothing ever consumed the artifact, and
      # upload-artifact's include-hidden-files=false default excludes
      # dot-directories anyway — it was a dead step that only emitted the
      # "No files were found" warning.

  security:
    # Always run: the blocking CVE gate is cheap, and a vulnerable dependency
    # must never be hidden behind the paths-filter.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit

      # Blocking CVE gate. Editable/private packages (the repo itself) are
      # excluded via pip freeze --exclude-editable — pip-audit's own
      # --skip-editable errors on them in 2.10.x. `--strict` fails on any
      # known vulnerability (the pytest 8.3.5 CVE was why this was a no-op).
      - name: Run pip-audit (blocking)
        run: |
          pip freeze --exclude-editable > /tmp/msb-audit-requirements.txt
          pip-audit -r /tmp/msb-audit-requirements.txt --strict

      - name: Check for secrets
        run: |
          git secrets --install || true
          git secrets --scan || true
        continue-on-error: true

      - name: Generate SBOM
        run: |
          pip install cyclonedx-bom
          # cyclonedx-py v7 requires a subcommand; `environment --pyproject`
          # roots the SBOM in pyproject.toml and scans this venv's pip-installed
          # packages (the repo has no requirements*.txt to scan).
          cyclonedx-py environment --pyproject pyproject.toml -o sbom.json --of json

      - name: Check license compliance
        run: |
          pip install pip-licenses
          pip-licenses --format=json --output-file=licenses.json
          grep -i "GPL\|AGPL" licenses.json && echo "::warning::GPL/AGPL license found" || true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-reports
          path: |
            .pip-audit/
            .git/secrets/
            sbom.json
            licenses.json
          retention-days: 7

  docker:
    # Always run — same no-masking rule as test/lint/security.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Docker image
        # Active since close-out Phase 1 (2026-08-15): the root Dockerfile
        # builds the real msb_v3 runtime. No secrets are baked — the image
        # runs with MSB_HOST=0.0.0.0 and reaches ollama/qdrant over the
        # network, so this bare smoke needs neither.
        #
        # Plain `docker build` (not buildx/build-push-action): buildx's
        # docker-container driver + push:false never loads the image into
        # the local daemon, so a follow-up `docker run` either tries to pull
        # the tag from Docker Hub (denied) or chokes on an exported tar.
        # `docker build` loads the image straight into the daemon the smoke
        # step runs on.
        run: docker build -t msb-v3:ci-${{ github.sha }} .

      - name: Run container smoke test
        run: |
          docker run -d -p 8766:8766 --name msb-v3-test msb-v3:ci-${{ github.sha }}
          trap 'docker rm -f msb-v3-test >/dev/null 2>&1 || true' EXIT
          # /status does not exist — /health is the app's liveness route, and
          # the image declares its own HEALTHCHECK against it. Wait on
          # Docker's own health state instead of probing curl from the runner
          # (a fixed 5s sleep raced slow boots on cold runners — observed
          # 2026-08-17 as "connection reset by peer"). Bounded to 60s; a
          # container that dies or goes unhealthy fails fast with its log.
          for _ in $(seq 1 60); do
            HEALTH=$(docker inspect -f '{{.State.Health.Status}}' msb-v3-test 2>/dev/null || echo gone)
            if [ "$HEALTH" = "healthy" ]; then
              echo "container healthy"
              exit 0
            fi
            if [ "$HEALTH" = "unhealthy" ] || [ "$HEALTH" = "gone" ]; then
              echo "container $HEALTH — log follows"
              docker logs msb-v3-test
              exit 1
            fi
            # Still "starting" (or the container died without a health probe
            # yet) — fail fast on an exited container instead of burning the
            # full budget on a crash.
            STATE=$(docker inspect -f '{{.State.Status}}' msb-v3-test 2>/dev/null || echo gone)
            if [ "$STATE" != "running" ]; then
              echo "container exited ($STATE) before becoming healthy — log follows"
              docker logs msb-v3-test
              exit 1
            fi
            sleep 1
          done
          echo "container never became healthy within 60s — log follows"
          docker logs msb-v3-test
          exit 1

  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify evidence claims
        run: python scripts/verify_claims.py docs/

      - name: Upload claim report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: claim-report
          path: artifacts/smi018/claim_report.json
          retention-days: 7

  notify:
    needs: [test, lint, security, docker, claims]
    if: always() && (needs.test.result == 'failure' || needs.lint.result == 'failure' || needs.security.result == 'failure' || needs.docker.result == 'failure' || needs.claims.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Notify failure
        run: |
          echo "::warning::CI pipeline failed. Check artifacts for details."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Only MSB_MCP_SECRET is configured today. The secrets context is NOT valid
  # in job-level `if`, so a tiny probe job checks the four DEPLOY_* secrets in
  # a step (where secrets ARE valid) and gates deploy on the result — until
  # they exist, deploy skips cleanly instead of firing an SSH deployment with
  # empty credentials on every push.
  deploy-ready:
    needs: [test, lint, security, docker, claims]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check deploy secrets configured
        id: check
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_PATH" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: deploy-ready
    if: needs.deploy-ready.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Pre-deploy backup
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}' && \
             cp -r \"\$DEPLOY_PATH\" \"\${DEPLOY_PATH}.bak.\$(date +%Y%m%d-%H%M%S)\"" || true

      - name: Deploy
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd '${{ secrets.DEPLOY_PATH }}' && \
             git pull origin main && \
             PYTHONPATH=src python -m pip install -e '.[dev]' --quiet && \
             PYTHONPATH=src /opt/homebrew/Caskroom/miniforge/base/bin/python -m uvicorn msb_v3.api.app:create_app --host 127.0.0.1 --port 8766 --daemon"

      - name: Health check
        run: |
          for _i in $(seq 1 12); do
            if curl -sf http://${{ secrets.DEPLOY_HOST }}:8766/status; then
              echo "Deploy healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Deploy failed health check"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd '${{ secrets.DEPLOY_PATH }}' && \
             git reset --hard HEAD~1 && \
             PYTHONPATH=src /opt/homebrew/Caskroom/miniforge/base/bin/python -m uvicorn msb_v3.api.app:create_app --host 127.0.0.1 --port 8766 --daemon"
