<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>MSB v3 — Sovereign Operations</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; }
    #root { padding: 24px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .header h1 { font-size: 20px; font-weight: 600; }
    .status { padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .status.connected { background: #0a3d0a; color: #4ade80; }
    .status.disconnected { background: #3d0a0a; color: #f87171; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { background: #141414; border: 1px solid #2a2a2a; border-radius: 8px; padding: 16px; }
    .card h2 { font-size: 14px; font-weight: 600; color: #888; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .card .value { font-size: 24px; font-weight: 700; }
    .card .detail { font-size: 12px; color: #666; margin-top: 4px; }
    .list { list-style: none; }
    .list li { padding: 8px 0; border-bottom: 1px solid #1a1a1a; font-size: 13px; }
    .list li:last-child { border-bottom: none; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-right: 6px; }
    .badge.evidence { background: #1a1a3d; color: #60a5fa; }
    .badge.vault { background: #1a3d1a; color: #4ade80; }
    .btn { background: #2563eb; color: white; border: none; padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn:hover { background: #1d4ed8; }
    .btn.danger { background: #dc2626; }
    .btn.danger:hover { background: #b91c1c; }
    .empty { color: #555; font-size: 13px; font-style: italic; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="app.js"></script>
</body>
</html>
