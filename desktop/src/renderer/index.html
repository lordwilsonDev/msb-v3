<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>MSB v3 - Sovereign Operations</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; }
    #root { padding: 24px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header h1 { font-size: 20px; font-weight: 600; }
    .status { padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; }
    .status.connected { background: #0a3d0a; color: #4ade80; }
    .status.degraded { background: #3d3208; color: #fbbf24; }
    .status.disconnected { background: #3d0a0a; color: #f87171; }
    .notice { background: #12203d; color: #93c5fd; padding: 8px 12px; border-radius: 6px; font-size: 12px; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .card { background: #141414; border: 1px solid #2a2a2a; border-radius: 8px; padding: 16px; }
    .card h2 { font-size: 13px; font-weight: 600; color: #888; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    .card .value { font-size: 22px; font-weight: 700; }
    .card .detail { font-size: 12px; color: #777; margin-top: 4px; }
    .muted { font-size: 13px; color: #888; margin: 8px 0 16px; }
    .err { font-size: 12px; color: #f87171; margin-bottom: 12px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: #9aa; margin-left: 12px; }
    .list { list-style: none; }
    .list li { padding: 10px 0; border-bottom: 1px solid #1e1e1e; font-size: 13px; }
    .list li:last-child { border-bottom: none; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .badge.evidence { background: #1a1a3d; color: #60a5fa; }
    .badge.vault { background: #1a3d1a; color: #4ade80; }
    .badge.kind { background: #2a2a2a; color: #bbb; }
    .btn { background: #2563eb; color: #fff; border: none; padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn:hover { background: #1d4ed8; }
    .btn.danger { background: #dc2626; }
    .btn.danger:hover { background: #b91c1c; }
    .in { background: #1a1a1a; border: 1px solid #2a2a2a; color: #e0e0e0; padding: 6px 12px; border-radius: 4px; }
    .empty { color: #555; font-size: 13px; font-style: italic; }
    details summary { cursor: pointer; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="app.js"></script>
</body>
</html>
